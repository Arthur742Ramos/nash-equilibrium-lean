# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Native Lean finite Nash equilibria"
  description: >-
    Formalizes finite strategic-form games with player-specific finite move
    sets, pure profiles, unilateral deviations, best responses, dominant
    strategies, and two distinct potential notions. The library names the
    one-way improvement condition a generalized ordinal potential and reserves
    ordinal potential for the standard bidirectional strict-sign condition.
    It proves a global potential-maximizer certificate for pure Nash
    equilibrium, the standard Nash/local-potential-maximum equivalence, and
    acyclicity of the better-response relation for the generalized class. The
    development also gives checked counterexamples and
    Prisoner's-Dilemma/matching-pennies examples, including the uniform mixed
    equilibrium for matching pennies.
  authors:
    - "Arthur Freitas Ramos"
  license: "BSD-3-Clause"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.LO", "cs.LO"]
  msc2020: ["91A10"]

sources:
  - title: "Potential Games"
    authors:
      - "Dov Monderer"
      - "Lloyd S. Shapley"
    id: "https://doi.org/10.1006/game.1996.0044"
    type: "article"
    location: "https://www.sciencedirect.com/science/article/pii/S0899825696900445"
    relationship: "foundational"
    note: >-
      Introduces and studies exact and ordinal potential functions for
      strategic-form games. The standard ordinal notion is the strict-sign
      equivalence used by the selected Lean theorem; the weaker one-way
      implication is tracked here as generalized.
    author_endorsement: "not-contacted"
  - title: "A class of games possessing pure-strategy Nash equilibria"
    authors:
      - "Robert W. Rosenthal"
    id: "https://doi.org/10.1007/BF01737559"
    type: "article"
    location: "https://doi.org/10.1007/BF01737559"
    relationship: "foundational"
    note: >-
      Foundational precursor on congestion games and pure-strategy existence
      through a potential construction.
    author_endorsement: "not-contacted"
  - title: "Flows and Decompositions of Games: Harmonic and Potential Games"
    authors:
      - "Ozan Candogan"
      - "Ishai Menache"
      - "Asuman Ozdaglar"
      - "Pablo A. Parrilo"
    id: "https://doi.org/10.1287/moor.1110.0500"
    type: "article"
    location: "https://pubsonline.informs.org/doi/10.1287/moor.1110.0500"
    relationship: "subsequent"
    note: >-
      Places potential games in a flow/decomposition framework and provides
      subsequent structural context for the potential component.
    author_endorsement: "not-contacted"
  - title: "A Library for Algorithmic Game Theory in Ssreflect/Coq"
    authors:
      - "Alexander Bagnall"
      - "Samuel Merten"
      - "Gordon Stewart"
    id: "https://doi.org/10.6092/issn.1972-5787/7235"
    type: "article"
    location: "https://jfr.unibo.it/article/view/7235"
    relationship: "comparative formalization"
    note: >-
      A directly relevant Coq/Ssreflect formalization of potential games,
      pure and mixed Nash equilibria, and best-response dynamics. The present
      repository is an independent Lean-native comparison with a narrower,
      explicitly audited pure-potential surface.
    author_endorsement: "not-contacted"
  - title: "Nash Equilibria for Finite Games in Isabelle/HOL"
    authors:
      - "Arthur Freitas Ramos"
      - "David Barros Hulak"
      - "Ruy Jose Guerra Barretto de Queiroz"
    id: "https://isa-afp.org/entries/Nash_Equilibrium.html"
    type: "website"
    location: "https://isa-afp.org/entries/Nash_Equilibrium.html"
    relationship: "comparative formalization"
    note: >-
      The AFP entry is the prior Isabelle formalization of finite pure and
      mixed Nash equilibria. This repository is a separate Lean-native
      implementation and is not a file-level translation; it makes the
      generalized/standard potential distinction explicit and selects the
      stronger structural theorem bundle described below.
    license: "BSD"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://isa-afp.org/entries/Nash_Equilibrium.html"
    relationship: "comparative formalization"
    note: >-
      Prior Isabelle formalization of pure and mixed finite Nash equilibria.
      The Lean development changes the definitions and proof architecture,
      separates generalized from standard ordinal potentials, and adds the
      explicit improvement-path interface.
  - id: "https://doi.org/10.6092/issn.1972-5787/7235"
    relationship: "comparative formalization"
    note: >-
      Prior Coq/Ssreflect library covering potential games and best-response
      dynamics; cited to position this Lean artifact without claiming
      methodological novelty over that work.

status:
  scope: >-
    The selected surface has three connected claims. First, every finite game
    with a standard ordinal potential has a pure Nash profile that globally
    maximizes the potential. Second, under the same standard bidirectional
    condition, pure Nash profiles are exactly potential local maxima. Third,
    the weaker generalized one-way condition still makes every nonempty
    better-response path strictly ascend and therefore rules out directed
    better-response cycles; the same finite argument gives weak acyclicity,
    so every legal starting profile reaches a pure Nash profile by some finite
    better-response path. A checked constant-payoff example demonstrates that
    generalized potentials may ascend on neutral deviations, so the two
    notions are not conflated. The library also defines mixed profiles and
    finite expected payoffs and proves the uniform mixed equilibrium of
    matching pennies. It does not claim a general mixed-Nash existence theorem
    via Brouwer.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Pinned Lean/Mathlib builds, closure-safe Challenge compilation, and Comparator-ready metadata."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The final definitions, statements, and proofs are checked by Lean's kernel."
  spend_usd: "subscription-based"
  notes: "AI assistance was used for proof engineering. The final definitions, statements, and proofs are checked by Lean's kernel."

fidelity:
  divergences: >-
    The Lean development uses a native Game structure, finite move sets,
    function-update deviations, a finite maximum over legal profiles, and
    explicit finite sums for the mixed layer. Its potential layer deliberately
    distinguishes the generalized one-way condition from the standard
    bidirectional condition and exposes finite better-response paths. The
    mixed layer currently formalizes the definitions and concrete
    matching-pennies equilibrium; it does not reproduce the Isabelle
    Brouwer-based general existence proof. The repository is an independent
    Lean-native companion, not a file-level translation.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The implementation library and Solution are proof-hole-free under the
    pinned local build. Challenge contains one deliberate Palomar statement
    hole. Hosted Comparator verification, Palomar editorial review, and
    registration are separate states and are not inferred from local
    compilation.

alignment:
  namespace: "NashEquilibrium.Palomar"
  statements:
    - source: "Finite ordinal-potential equilibrium existence"
      lean: "NashEquilibrium.Palomar.exists_nash_maximizing_ordinal_potential"
      module: "Solution.lean"
      status: "proved"
      note: >-
        A finite game with nonempty player strategy sets and a standard
        ordinal potential has a pure Nash equilibrium that globally maximizes
        the potential.
    - source: "Nash/local-potential-maximum equivalence"
      lean: "NashEquilibrium.Palomar.isNash_iff_potential_local_maximum"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Under the standard strict-sign equivalence, pure Nash profiles are
        exactly local maxima of the potential over legal unilateral moves.
    - source: "Finite improvement acyclicity"
      lean: "NashEquilibrium.Palomar.no_betterResponse_cycle_of_generalized_ordinal_potential"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The generalized one-way condition makes every nonempty finite
        better-response path strictly ascend and forbids directed cycles.
    - source: "Weak acyclicity under generalized potentials"
      lean: "NashEquilibrium.Palomar.weaklyAcyclic_of_generalized_ordinal_potential"
      module: "Solution.lean"
      status: "proved"
      note: >-
        From every legal starting profile, some finite better-response path
        reaches a pure Nash equilibrium. This exposes the finite dynamics
        consequence as a first-class theorem rather than leaving it implicit
        in a global-maximization proof.
    - source: "Generalized versus standard potential terminology"
      lean: "NashEquilibrium.neutralDeviationPotential_not_standard"
      module: "NashEquilibrium/Examples.lean"
      status: "proved"
      note: >-
        A constant-payoff game has a generalized potential with a strict rise
        on a neutral deviation, but that potential is not standard ordinal.
    - source: "Pure Nash equilibrium"
      lean: "NashEquilibrium.IsNash"
      module: "NashEquilibrium/Basic.lean"
      status: "defined"
      note: "No legal unilateral deviation improves the deviating player's payoff."
    - source: "Finite mixed profiles"
      lean: "NashEquilibrium.IsMixedProfile"
      module: "NashEquilibrium/Mixed.lean"
      status: "defined"
      note: "Nonnegative finite probability weights sum to one per player."
    - source: "Matching-pennies mixed equilibrium"
      lean: "NashEquilibrium.matchingPennies_uniform_mixed_nash"
      module: "NashEquilibrium/Examples.lean"
      status: "proved"
      note: "The uniform profile is a mixed equilibrium under finite enumeration."

