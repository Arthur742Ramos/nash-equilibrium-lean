version: "v0.4"

project:
  name: "Native Lean finite Nash equilibria"
  description: >-
    Formalizes finite strategic-form games with player-specific finite move
    sets, pure profiles, unilateral deviations, best responses, dominant
    strategies, and two distinct potential notions. The library names the
    one-way improvement condition a generalized ordinal potential and reserves
    ordinal potential for the standard bidirectional strict-sign condition.
    It proves a global potential-maximizer certificate for pure Nash
    equilibrium, the standard Nash/local-potential-maximum equivalence, and
    acyclicity of the better-response relation for the generalized class. The
    development also gives checked counterexamples and
    Prisoner's-Dilemma/coordination/matching-pennies/rock-paper-scissors
    examples. Its native mixed layer proves support equalization, Dirac
    transport, the normalized excess-map reduction, and the closed/compact/
    convex/continuous finite mixed-profile geometry. It also proves general
    finite mixed-Nash existence on a common nonempty move type by connecting
    the native excess map to an attributed, kernel-checked product-of-simplices
    Brouwer theorem. This is a reusable formalization artifact, not a claim of
    new mathematics or the first Lean proof of Nash existence.
  authors:
    - "Arthur Freitas Ramos"
  license: "BSD-3-Clause AND MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

