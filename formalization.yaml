status:
  scope: >-
    The selected surface contains six theorems. First, every finite game
    with a standard ordinal potential has a pure Nash profile that globally
    maximizes the potential. Second, under the same standard bidirectional
    condition, pure Nash profiles are exactly potential local maxima. Third,
    the weaker generalized one-way condition still makes every nonempty
    better-response path strictly ascend and therefore rules out directed
    better-response cycles; the same finite argument gives weak acyclicity,
    so every legal starting profile reaches a pure Nash profile by some finite
    better-response path. A checked constant-payoff example demonstrates that
    generalized potentials may ascend on neutral deviations, so the two
    notions are not conflated. The fifth selected theorem proves mixed support
    equalization, and the sixth proves mixed existence. The library defines mixed profiles and
    finite expected payoffs, proves support equalization and Dirac transport,
    and supplies the normalized excess-map and finite mixed-profile topology.
    The native bridge then applies the included product-simplex Brouwer
    theorem, yielding a mixed Nash equilibrium for every finite real-payoff game
    on a common nonempty move type, with every move available to every player;
    the empty-player case is discharged directly. Player-specific legal-move
    restrictions in the pure layer are not part of this mixed theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Pinned Lean/Mathlib builds, closure-safe Challenge compilation, and Comparator-ready metadata."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The final definitions, statements, and proofs are checked by Lean's kernel."
  spend_usd: "subscription-based"
  notes: "AI assistance was used for proof engineering. The final definitions, statements, and proofs are checked by Lean's kernel."

fidelity:
  divergences: >-
    The Lean development uses a native Game structure, finite move sets,
    function-update deviations, a finite maximum over legal profiles, and
    explicit finite sums for the mixed layer. Its potential layer deliberately
    distinguishes the generalized one-way condition from the standard
    bidirectional condition and exposes finite better-response paths. The
    mixed layer formalizes native finite expected payoffs, support and Dirac
    lemmas, the normalized excess-map reduction, concrete matching pennies and
    rock-paper-scissors equilibria, and the closed/compact/convex continuous
    mixed-profile setup. The final existence theorem uses the included,
    attributed Scarf/Brouwer fixed-point source and contributes a native
    arbitrary-finite-type bridge; it is not a file-level translation of the
    Isabelle entry.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The implementation library and Solution are proof-hole-free under the
    pinned local build. Challenge contains two deliberate Palomar statement
    holes, excluded from the implementation sorry_count. The fixed-point core is included under the MIT notice in
    THIRD_PARTY_NOTICES.md and builds without proof placeholders. Hosted
    Comparator verification, Palomar editorial review, and registration are
    separate states and are not inferred from local compilation. This is a
    reusable formalization artifact, not a claim of a new economic theorem or
    first Lean proof of Nash existence. Research interest remains subject to
    editorial assessment.

alignment:
  namespace: "NashEquilibrium.Palomar"
  statements:
    - source: "Finite ordinal-potential equilibrium existence"
      lean: "NashEquilibrium.Palomar.exists_nash_maximizing_ordinal_potential"
      module: "Solution.lean"
      status: "proved"
      note: >-
        A finite game with nonempty player strategy sets and a standard
        ordinal potential has a pure Nash equilibrium that globally maximizes
        the potential.
    - source: "Nash/local-potential-maximum equivalence"
      lean: "NashEquilibrium.Palomar.isNash_iff_potential_local_maximum"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Under the standard strict-sign equivalence, pure Nash profiles are
        exactly local maxima of the potential over legal unilateral moves.
    - source: "Finite improvement acyclicity"
      lean: "NashEquilibrium.Palomar.no_betterResponse_cycle_of_generalized_ordinal_potential"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The generalized one-way condition makes every nonempty finite
        better-response path strictly ascend and forbids directed cycles.
    - source: "Weak acyclicity under generalized potentials"
      lean: "NashEquilibrium.Palomar.weaklyAcyclic_of_generalized_ordinal_potential"
      module: "Solution.lean"
      status: "proved"
      note: >-
        From every legal starting profile, some finite better-response path
        reaches a pure Nash equilibrium. This exposes the finite dynamics
        consequence as a first-class theorem rather than leaving it implicit
        in a global-maximization proof.
    - source: "Generalized versus standard potential terminology"
      lean: "NashEquilibrium.neutralDeviationPotential_not_standard"
      module: "NashEquilibrium/Examples.lean"
      status: "proved"
      note: >-
        A constant-payoff game has a generalized potential with a strict rise
        on a neutral deviation, but that potential is not standard ordinal.
    - source: "Pure Nash equilibrium"
      lean: "NashEquilibrium.IsNash"
      module: "NashEquilibrium/Basic.lean"
      status: "defined"
      note: "No legal unilateral deviation improves the deviating player's payoff."
    - source: "Finite mixed profiles"
      lean: "NashEquilibrium.IsMixedProfile"
      module: "NashEquilibrium/Mixed.lean"
      status: "defined"
      note: "Nonnegative finite probability weights sum to one per player."
    - source: "Mixed support equalization"
      lean: "NashEquilibrium.Palomar.mixedNash_support_payoff_eq"
      module: "Solution.lean"
      status: "proved"
      note: "Every strictly positive-probability move at a mixed Nash equilibrium receives the equilibrium payoff."
    - source: "Matching-pennies mixed equilibrium"
      lean: "NashEquilibrium.matchingPennies_uniform_mixed_nash"
      module: "NashEquilibrium/Examples.lean"
      status: "proved"
      note: "The uniform profile is a mixed equilibrium under finite enumeration."
    - source: "Rock-paper-scissors mixed equilibrium"
      lean: "NashEquilibrium.rps_uniform_mixed_nash"
      module: "NashEquilibrium/Examples.lean"
      status: "proved"
      note: "The uniform profile is a mixed equilibrium under finite enumeration."
    - source: "Mixed fixed-point reduction"
      lean: "NashEquilibrium.mixedNash_of_nashMap_fixedPoint"
      module: "NashEquilibrium/Mixed.lean"
      status: "proved"
      note: "A fixed point of the normalized excess map is a mixed Nash equilibrium."
    - source: "Finite mixed-profile geometry"
      lean: "NashEquilibrium.mixedProfiles_compact"
      module: "NashEquilibrium/MixedTopology.lean"
      status: "proved"
      note: >-
        The mixed-profile set is compact; corresponding closedness, convexity,
        nonemptiness, and continuity lemmas are also proved.
    - source: "Conditional mixed-equilibrium existence"
      lean: "NashEquilibrium.exists_mixedNash_of_nashMap_fixedPoint"
      module: "NashEquilibrium/MixedTopology.lean"
      status: "proved"
      note: >-
        Any fixed point supplied for the normalized excess map yields a mixed
        Nash equilibrium.
    - source: "Product-simplex Brouwer fixed point"
      lean: "Brouwer_Product"
      module: "Gametheory/Brouwer_product.lean"
      status: "proved"
      note: >-
        A continuous self-map of a finite product of standard simplices has a
        fixed point. The included source is attributed to the MIT-licensed
        Scarf/Brouwer Lean development.
    - source: "Normalized excess-map fixed point"
      lean: "NashEquilibrium.exists_nashMap_fixedPoint"
      module: "NashEquilibrium/MixedBrouwer.lean"
      status: "proved"
      note: >-
        The native mixed-profile map has a fixed point for every finite game
        with a nonempty move type; the proof reindexes finite types and uses
        the product-simplex Brouwer theorem.
    - source: "General finite mixed-Nash existence"
      lean: "NashEquilibrium.Palomar.exists_mixedNash"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Reindexes arbitrary finite player and move types, applies the
        product-simplex Brouwer theorem to the normalized excess map, and
        converts the resulting fixed point into a mixed Nash equilibrium.
        All players share the same nonempty move type and may use every move.

